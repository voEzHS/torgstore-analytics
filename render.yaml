# Render Blueprint — TorgStore Analytics
#
# База НЕ создаётся этим блюпринтом. Render free tier разрешает только одну
# бесплатную Postgres-базу на аккаунт, и её уже занимает kaspi-db (соседний
# проект на этом же Render-аккаунте). TorgStore переиспользует kaspi-db,
# изолируясь через отдельную схему (DB_SCHEMA=torgstore) — см. database.py
# и migrate.py.
#
# DATABASE_URL и DB_SCHEMA поэтому НЕ описаны здесь (sync: false) — они
# задаются один раз вручную в Render Dashboard → Environment и дальше не
# трогаются при повторных синках блюпринта.
#
# ⚠️ kaspi-db на бесплатном тарифе Render истекает через 30 дней с создания
# и будет удалена, если её не перевести на платный план. Пока она бесплатна —
# TorgStore живёт на её же счётчике времени жизни.

services:
  - type: web
    name: torgstore-analytics
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: torgstore
      - key: SECRET_KEY
        generateValue: true
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
